services:
  - type: web
    name: ticketpilot-i221296
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENABLE_DEMO
        value: "false"
      - key: MODEL_PROVIDER
        value: groq
      - key: MODEL_NAME
        value: openai/gpt-oss-20b
      - key: MODEL_NAMES
        value: openai/gpt-oss-20b,openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_PRICES_JSON
        value: '{"openai/gpt-oss-20b":{"input":0.075,"output":0.30},"openai/gpt-oss-120b":{"input":0.15,"output":0.60}}'
      - key: MAX_OUTPUT_TOKENS
        value: "2048"
