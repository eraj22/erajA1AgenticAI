services:
  - type: web
    name: ticketpilot-i221296
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENABLE_DEMO
        value: "false"
      - key: MODEL_PROVIDER
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: MODEL_NAMES
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_PRICES_JSON
        value: "{}"

